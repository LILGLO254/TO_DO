<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2430; --muted: #7a8194;
    --accent: #3b6cf6; --border: #e4e7ee; --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1d2028; --text: #e8eaf0; --muted: #8b91a3; --border: #2b2f3a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  .app {
    width: 100%; max-width: 480px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06); align-self: flex-start;
  }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; padding: 12px 14px; font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
  }
  .add { background: var(--accent); color: #fff; padding: 0 18px; font-weight: 600; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; }
  .filters button {
    background: transparent; color: var(--muted); padding: 6px 12px; font-size: .875rem;
    border: 1px solid var(--border);
  }
  .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  li span { flex: 1; word-break: break-word; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  .del { background: transparent; color: var(--muted); font-size: 1.2rem; padding: 2px 8px; }
  .del:hover { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); font-size: .875rem; }
  .clear { background: transparent; color: var(--muted); text-decoration: underline; font-size: .875rem; }
  .clear:hover { color: var(--danger); }
</style>
</head>
<body>
<main class="app">
  <h1>My To-Do List</h1>
  <form id="form">
    <input type="text" id="input" placeholder="Add a task…" autocomplete="off" aria-label="New task" required>
    <button class="add" type="submit">Add</button>
  </form>
  <div class="filters" id="filters">
    <button data-f="all" class="active">All</button>
    <button data-f="active">Active</button>
    <button data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button class="clear" id="clear">Clear completed</button>
  </footer>
</main>

<script>
  const KEY = "todo-items-v1";
  let todos = [];
  let filter = "all";

  try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }

  const $ = (id) => document.getElementById(id);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} };

  function render() {
    const list = $("list");
    list.innerHTML = "";
    const shown = todos.filter(t =>
      filter === "all" ? true : filter === "done" ? t.done : !t.done);

    if (!shown.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.textContent = "Nothing here yet.";
      list.appendChild(p);
    }

    shown.forEach(t => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };

      const span = document.createElement("span");
      span.textContent = t.text;

      const del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "Delete task");
      del.textContent = "×";
      del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };

      li.append(cb, span, del);
      list.appendChild(li);
    });

    const left = todos.filter(t => !t.done).length;
    $("count").textContent = left + (left === 1 ? " task left" : " tasks left");
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text) return;
    todos.unshift({ id: Date.now() + Math.random(), text, done: false });
    $("input").value = "";
    save(); render();
  });

  $("filters").addEventListener("click", (e) => {
    const f = e.target.dataset.f;
    if (!f) return;
    filter = f;
    document.querySelectorAll("#filters button").forEach(b =>
      b.classList.toggle("active", b.dataset.f === f));
    render();
  });

  $("clear").onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

  render();
</script>
</body>
</html>
